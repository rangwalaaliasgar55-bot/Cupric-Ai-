<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>NewBrand effect — stack ripple</title>
<!--
  Notification stack that fans open, after the Forge UI "Stack Ripple"
  component. Dependency-free so the local renderer can seek it per frame.
-->
<style>
  html, body { margin: 0; background: #000; overflow: hidden; }
  #scene {
    width: 1080px; height: 1920px; position: relative; box-sizing: border-box;
    background: #0B0B10;
    display: flex; align-items: center; justify-content: center;
    font-family: Inter, system-ui, sans-serif; color: #F4F1EA;
  }
  #stage { position: relative; width: 760px; height: 520px; }
  .note {
    position: absolute; left: 50%; top: 200px; width: 700px; margin-left: -350px;
    box-sizing: border-box; height: 128px; padding: 0 26px;
    display: flex; align-items: center; justify-content: space-between;
    border-radius: 22px;
    background: linear-gradient(to bottom, #151518, #0d0d10);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.07), inset 0 2px 0 0 rgba(255,255,255,0.05);
  }
  .left { display: flex; align-items: center; gap: 20px; }
  .icon { width: 72px; height: 72px; border-radius: 20px; display: flex; align-items: center; justify-content: center; font-size: 32px; }
  .title { font-size: 26px; font-weight: 600; }
  .desc { font-size: 20px; color: rgba(244,241,234,0.5); margin-top: 4px; }
  .time { font-size: 20px; color: rgba(244,241,234,0.45); }
</style>
</head>
<body>
<div id="scene">
  <div id="stage">
    <div class="note" id="n3">
      <div class="left">
        <div class="icon" style="background:#22c55e">$</div>
        <div><div class="title">Billing Reminder</div><div class="desc">NewBrand</div></div>
      </div>
      <div class="time">9 hrs ago</div>
    </div>
    <div class="note" id="n2">
      <div class="left">
        <div class="icon" style="background:#eab308">&#128100;</div>
        <div><div class="title">User Signed Up</div><div class="desc">NewBrand</div></div>
      </div>
      <div class="time">7 hrs ago</div>
    </div>
    <div class="note" id="n1">
      <div class="left">
        <div class="icon" style="background:#FF3D71">&#128172;</div>
        <div><div class="title">New Message</div><div class="desc">NewBrand</div></div>
      </div>
      <div class="time">3 hrs ago</div>
    </div>
  </div>
</div>
<script>
var DUR = 5, FPS = 30;
function clamp(v, a, b) { return Math.min(b, Math.max(a, v)); }
// Critically-ish damped spring evaluated in closed form: no rAF, so the value
// depends only on t and the frame the renderer grabs is always reproducible.
function spring(p) {
  if (p <= 0) return 0;
  if (p >= 1) return 1;
  return 1 - Math.exp(-7 * p) * Math.cos(9 * p);
}
window.__seek = function (t) {
  // Fan opens between 0.8s and 2.6s, then holds.
  var p = spring(clamp((t - 0.8) / 1.8, 0, 1));
  var set = function (id, y, scale) {
    document.getElementById(id).style.transform =
      'translateY(' + y + 'px) scale(' + scale + ')';
  };
  set('n1', -150 * p, 1);
  set('n2', 0, 0.95 + 0.05 * p);
  set('n3', 150 * p, 0.9 + 0.1 * p);
};
window.__newbrandSourceManifest = {
  sources: ['forge-ui'],
  sequence: [
    { from: 0, to: 0.8, type: 'hold', copy: 'stacked notifications' },
    { from: 0.8, to: 2.6, type: 'reveal', copy: 'fan open' },
    { from: 2.6, to: 5, type: 'hold', copy: 'three notifications' }
  ],
  renderSpec: { durationSec: DUR, fps: FPS, size: [1080, 1920] }
};
window.__seek(0);
</script>
</body>
</html>
