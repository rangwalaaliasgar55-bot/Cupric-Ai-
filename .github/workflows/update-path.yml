name: Verify the update path (version to version)

# Phase 4: an updater can only be verified by updating something. This workflow
# builds two real releases — the tag you name as the "from" version and the tag
# you name as the "to" version — and runs scripts/check-update-path.mjs, which
# installs the old build, serves the new one over HTTP, launches the installed
# app against that feed, waits for the update to download, closes the app, and
# requires Windows to report the new version on the installed executable
# afterwards.
#
# It packages two complete builds (about fifteen minutes), which is why it is a
# workflow of its own rather than a step in the pull-request gate. It runs:
#
#   - on every pull request, against the last released tag as the "from" version
#     and the pull request's own checkout as the "to" version. This is the only
#     way the update path can be verified at all in a repository whose release
#     workflow can only be triggered by a tag: without it, the machinery that
#     keeps every existing installation current is never executed until the day
#     it is needed.
#   - on demand, with any two refs.
#
# It does not block the merge gate (it is not the required status check), because
# a signed installation updating to an *unsigned* pull-request build can
# legitimately fail signature verification — a finding about the release process
# rather than about the change under review. When that happens the job says so in
# those terms; see docs/PHASE4_RELEASE.md.

on:
  workflow_dispatch:
    inputs:
      from_tag:
        description: 'Version to install first (for example, v0.13.0)'
        required: true
        type: string
      to_tag:
        description: 'Version the app must update itself to. Empty builds the checked-out commit.'
        required: false
        default: ''
        type: string
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  update-path:
    name: Install the previous release, update to ${{ github.event.inputs.to_tag || 'this pull request' }}
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      ELECTRON_BUILDER_PUBLISH: never
      # A pull request has no inputs, so the "from" version is resolved in the
      # step below from the repository itself (the most recent tag on main)
      # rather than hard-coded here — a pinned tag rots, and a tag that predates
      # a script this workflow calls fails the build for a reason that has
      # nothing to do with updating. An empty "to" means "build the commit under
      # review".
      FROM_INPUT: ${{ github.event.inputs.from_tag || '' }}
      TO_REF: ${{ github.event.inputs.to_tag || '' }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Each build is checked out into its own worktree so package.json, dist/
      # and electron/ cannot leak between them — which also means each worktree
      # needs its own `npm ci` (a worktree has no node_modules). The check script
      # itself needs nothing but Node.
      - name: Decide which released version to install first
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:FROM_INPUT)) {
            # The newest tag reachable from main. Not "the newest tag": a tag on
            # a branch that was never merged is not a release anybody installed.
            $resolved = (git describe --tags --abbrev=0 origin/main).Trim()
            Write-Host "no from_tag given; resolved the previous release as $resolved"
          } else {
            $resolved = $env:FROM_INPUT.Trim()
            Write-Host "using the from_tag given: $resolved"
          }
          if ([string]::IsNullOrWhiteSpace($resolved)) { throw "Could not resolve a released version to install." }
          git rev-parse --verify "$resolved^{commit}" | Out-Null
          "FROM_REF=$resolved" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build the version to install first
        shell: pwsh
        run: |
          Write-Host "from: $env:FROM_REF"
          git worktree add ../cupric-from $env:FROM_REF
          Push-Location ../cupric-from
          npm ci
          # The installer this job builds must contain working media tools, or
          # the "update" it proves would be an update to an app that cannot
          # render, or cannot check what it rendered. `--if-present` because an
          # older release may predate this script — and the step says which case
          # it is, so a silent skip cannot pass for a checked download.
          npm run media:ensure --if-present
          if ($LASTEXITCODE -ne 0) { throw "media:ensure failed while building $env:FROM_REF" }
          npm run build
          npx electron-builder --win --publish never
          Pop-Location
          Copy-Item ../cupric-from/release -Destination ./release-from -Recurse
          Get-ChildItem ./release-from | Format-Table Name, Length

      - name: Build the version the app must update itself to
        shell: pwsh
        run: |
          Write-Host "to: $env:TO_REF (empty means the checked-out commit)"
          if ([string]::IsNullOrWhiteSpace($env:TO_REF)) {
            # The pull-request case: this checkout is the "to" version.
            npm ci
            # This checkout is the code under review, so the media tools must be
            # really here (no --if-present): the shipped app cannot render
            # without them.
            npm run media:ensure
            npm run build
            npx electron-builder --win --publish never
            New-Item -ItemType Directory -Force -Path ./release-to | Out-Null
            Copy-Item ./release/* -Destination ./release-to -Recurse -Force
          } else {
            git worktree add ../cupric-to $env:TO_REF
            Push-Location ../cupric-to
            npm ci
            npm run media:ensure --if-present
            if ($LASTEXITCODE -ne 0) { throw "media:ensure failed while building $env:TO_REF" }
            npm run build
            npx electron-builder --win --publish never
            Pop-Location
            Copy-Item ../cupric-to/release -Destination ./release-to -Recurse
          }
          Get-ChildItem ./release-to | Format-Table Name, Length

      # The two builds must be different versions, or the test proves nothing.
      - name: Confirm the two feeds differ
        shell: pwsh
        run: |
          $from = (Get-Content ./release-from/latest.yml | Select-String '^version:').ToString().Split(':')[1].Trim()
          $to = (Get-Content ./release-to/latest.yml | Select-String '^version:').ToString().Split(':')[1].Trim()
          if ($from -eq $to) { throw "Both builds are $from — the update path cannot be tested against the same version." }
          Write-Host "from $from → to $to"

      - name: Install the old build, update it, and verify the result
        shell: pwsh
        run: |
          $setup = (Get-ChildItem -Path ./release-from -Filter 'Cupric-AI-Setup-*.exe' -File).FullName
          if (-not $setup) { throw 'No setup installer in release-from.' }
          node scripts/check-update-path.mjs --from $setup --to ./release-to

      - name: Upload both release directories for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: update-path-${{ env.FROM_REF }}-to-${{ env.TO_REF || 'pr' }}
          if-no-files-found: warn
          path: |
            release-from/latest.yml
            release-to/latest.yml

      - name: Show the filesystem state of the runner if the test failed
        if: failure()
        shell: pwsh
        run: |
          Write-Host '--- installed app directories ---'
          Get-ChildItem 'C:\cupric-*' -ErrorAction SilentlyContinue | Format-Table FullName, Length
          Write-Host '--- update cache ---'
          Get-ChildItem "$env:LOCALAPPDATA\Cupric AI-updater" -Recurse -ErrorAction SilentlyContinue | Format-Table FullName, Length
          Write-Host '--- the app log from the update run (throwaway userData dir) ---'
          Get-ChildItem "$env:TEMP\cupric-update-path-data-*" -Recurse -Filter '*.log' -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_.FullName; Get-Content $_.FullName -Tail 80 }
