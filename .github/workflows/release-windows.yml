name: Release Windows installer

on:
  push:
    tags:
      - 'v*'
    branches:
      - '**'
    # A versioned release request allows a release to be started from a
    # protected branch without granting a developer token workflow-dispatch access.
    paths:
      - '.github/release.json'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create or update (for example, v0.2.1)'
        required: true
        type: string

# Publishing is deliberately performed only after electron-builder has created
# the NSIS installer. A failed build cannot leave an empty public release.
permissions:
  contents: write

jobs:
  build-and-publish:
    name: Build and publish Windows installer
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      # Prevent electron-builder from publishing before this job has verified
      # the generated artifacts and attached them to the intended release.
      ELECTRON_BUILDER_PUBLISH: never
    steps:
      - name: Check out release source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Resolve and validate release tag
        id: release
        shell: bash
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="$REQUESTED_TAG"
          elif [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="$(node -p "require('./.github/release.json').tag")"
          fi

          package_version="$(node -p "require('./package.json').version")"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]] || { echo "Invalid release tag: $tag"; exit 1; }
          [[ "$tag" == "v$package_version" ]] || { echo "$tag does not match package version $package_version"; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Install locked dependencies
        run: npm ci

      - name: Build application and Windows packages
        run: npm run dist:win -- --publish never

      - name: Verify installer artifacts
        shell: pwsh
        run: |
          $setup = Get-ChildItem -Path release -Filter 'Cupric AI-Setup-*.exe' -File
          if ($setup.Count -ne 1) {
            throw "Expected exactly one NSIS setup executable; found $($setup.Count)."
          }
          if ($setup[0].Length -lt 10MB) {
            throw "The generated setup executable is unexpectedly small."
          }
          Get-ChildItem -Path release -File | Format-Table Name, Length

      - name: Preserve release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Cupric-AI-Windows-${{ steps.release.outputs.tag }}
          if-no-files-found: error
          path: |
            release/Cupric AI-Setup-*.exe
            release/Cupric AI-Setup-*.exe.blockmap
            release/Cupric AI-*-Portable.exe
            release/latest.yml

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Cupric AI ${{ steps.release.outputs.tag }}
          generate_release_notes: true
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            release/Cupric AI-Setup-*.exe
            release/Cupric AI-Setup-*.exe.blockmap
            release/Cupric AI-*-Portable.exe
            release/latest.yml
