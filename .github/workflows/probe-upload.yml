name: Probe asset-name encoding (temporary)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    name: Upload space-named probe asset
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Upload %20-encoded probe file to v0.8.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $repo = "${{ github.repository }}"
          "probe" | Out-File -Encoding ascii probe.txt
          $rel = gh api "repos/$repo/releases/tags/v0.8.0" --jq '.id'
          $uploadUrl = gh api "repos/$repo/releases/$rel" --jq '.upload_url'
          $base = $uploadUrl.Split('{')[0]
          curl.exe -s -X POST -H "Authorization: Bearer $env:GH_TOKEN" -H "Content-Type: text/plain" --data-binary "@probe.txt" "$($base)?name=probe%20space%20pct20.txt"
          Write-Host ""
          Write-Host "--- uploaded, current probe assets: ---"
          gh release view v0.8.0 --repo $repo --json assets --jq '.assets[].name | select(startswith("probe"))'
